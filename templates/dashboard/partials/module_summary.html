{% load ui_tags %}
<div class="row g-3 mb-3">
    <div class="col-xl-2 col-md-4 col-6"><div class="card panel-card stat-card stat-card-primary"><div class="card-body"><div class="label">🚀 总请求数</div><div class="value">{{ dashboard.total_requests }}</div></div></div></div>
    <div class="col-xl-3 col-md-6 col-6"><div class="card panel-card stat-card stat-card-blue"><div class="card-body"><div class="label">🧮 已消耗 Token</div><div class="value">{{ dashboard.total_tokens|token_unit }}</div></div></div></div>
    <div class="col-xl-3 col-md-6 col-6"><div class="card panel-card stat-card stat-card-violet"><div class="card-body"><div class="label">💵 Token 价值</div><div class="value">${{ dashboard.total_cost|at_most:4 }}</div></div></div></div>
    <div class="col-xl-2 col-md-4 col-6"><div class="card panel-card stat-card stat-card-danger"><div class="card-body"><div class="label">⚠️ 错误率</div><div class="value">{{ dashboard.error_rate }}%</div></div></div></div>
    <div class="col-xl-2 col-md-4 col-6"><div class="card panel-card stat-card stat-card-success"><div class="card-body"><div class="label">👥 活跃队员</div><div class="value">{{ dashboard.active_users }}</div></div></div></div>
</div>
